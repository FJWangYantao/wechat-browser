<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>微信读书样式</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <h1>微信读书样式</h1>
    <label class="switch" title="Alt+Shift+W">
      <input type="checkbox" id="enabled" />
      <span></span>
    </label>
  </header>

  <main id="panel">
    <section>
      <h2>主题</h2>
      <div class="themes" id="themes"></div>
    </section>

    <section>
      <h2>颜色</h2>
      <div class="row">
        <label for="bgColor">背景</label>
        <input type="color" id="bgColor" />
      </div>
      <div class="row">
        <label for="textColor">文字</label>
        <input type="color" id="textColor" />
      </div>
      <label class="check">
        <input type="checkbox" id="recolorText" />
        重绘正文文字颜色
      </label>
    </section>

    <section>
      <h2>字体</h2>
      <select id="fontPreset"></select>
      <input type="text" id="fontFamily" placeholder="自定义字体名，如 LXGW WenKai" spellcheck="false" />
      <p class="hint">需本机已安装该字体。</p>
    </section>

    <section>
      <h2>版面</h2>
      <div class="row">
        <label for="contentWidth">版心宽度</label>
        <output id="widthValue"></output>
      </div>
      <input type="range" id="contentWidth" min="600" max="1800" step="20" />
      <button type="button" class="link" id="widthReset">恢复原版宽度</button>
      <label class="check">
        <input type="checkbox" id="immersive" />
        沉浸模式（隐藏顶栏和右侧按钮，鼠标停留片刻才显示）
      </label>
    </section>

    <section>
      <h2>连续滚动</h2>
      <label class="check">
        <input type="checkbox" id="flowMode" />
        像知乎一样一直往下滚，章节无缝接上
      </label>
      <div class="row spaced">
        <label for="scrollSpeed">自动滚屏速度</label>
        <output id="speedValue"></output>
      </div>
      <input type="range" id="scrollSpeed" min="10" max="400" step="10" />
      <button type="button" class="primary" id="autoScroll">开始自动滚屏</button>
      <p class="hint" id="autoScrollHint">需在微信读书的单栏模式下使用 · Alt+Shift+S</p>
    </section>

    <section>
      <h2>AI 陪读</h2>
      <label class="check">
        <input type="checkbox" id="aiSelectButton" />
        划选文字后显示「问 AI」按钮
      </label>
      <div class="row spaced">
        <label for="aiKey">Anthropic API Key</label>
        <a class="link small" href="https://console.anthropic.com/settings/keys" target="_blank" rel="noreferrer">获取</a>
      </div>
      <input type="password" id="aiKey" placeholder="sk-ant-…" autocomplete="off" spellcheck="false" />
      <div class="row spaced">
        <label for="aiModel">模型</label>
      </div>
      <select id="aiModel"></select>
      <details class="inline">
        <summary>自定义接口地址</summary>
        <div class="url-row">
          <input type="text" id="aiBaseURL" placeholder="留空使用官方接口" spellcheck="false" />
          <button type="button" id="aiBaseURLSave">保存</button>
        </div>
        <p class="hint" id="aiBaseURLHint">所在网络无法直连官方接口时，可填写兼容 Anthropic 接口的代理地址。</p>
      </details>
      <button type="button" class="primary" id="aiPanel">打开 AI 陪读面板</button>
      <p class="hint">选中的文字和附近段落会发给 Anthropic 用于回答 · Alt+Shift+A</p>
    </section>

    <details>
      <summary>自定义 CSS</summary>
      <textarea id="customCss" rows="6" spellcheck="false" placeholder=".readerFooter { display: none !important; }"></textarea>
    </details>
  </main>

  <footer>
    <span class="hint">正文没刷新时，刷新一下页面</span>
    <button type="button" id="reset">全部重置</button>
  </footer>

  <script src="../shared/settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
